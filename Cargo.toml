# Standalone workspace boundary so parent workspaces that include this
# crate as a path dependency don't recurse into it for `cargo fmt --all`,
# `cargo check --workspace`, etc.
[workspace]

[package]
name = "fast-wallet"
version = "0.1.33"
edition = "2021"
description = "High-performance EVM wallet optimized for liquidation bots and MEV"
authors = ["Ming <ming@xinxiao.tech>"]
license = "MIT"
repository = "https://github.com/sunoj/fast-wallet"
homepage = "https://github.com/sunoj/fast-wallet"
documentation = "https://docs.rs/fast-wallet"
readme = "README.md"
keywords = ["evm", "wallet", "ethereum", "mev", "liquidation"]
categories = ["cryptography::cryptocurrencies", "web-programming"]

[lib]
name = "fast_wallet"
path = "src/lib.rs"

[[bin]]
name = "fast-wallet"
path = "src/main.rs"

[[bench]]
name = "transaction_benchmark"
harness = false

[[bench]]
name = "rpc_benchmark"
harness = false

[[example]]
name = "anvil_benchmark"
path = "examples/anvil_benchmark.rs"

[[example]]
name = "liquidation_bot"
path = "examples/liquidation_bot.rs"

[features]
default = []
# Use Bitcoin Core's libsecp256k1 for ~2-3x faster signing
# Requires C compiler for build
secp256k1-ffi = ["secp256k1"]

[dependencies]
# Async runtime - tokio for high-performance async
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Fast crypto primitives
k256 = { version = "0.13", features = ["ecdsa"] }

# Bitcoin Core's secp256k1 C library (optional, faster)
secp256k1 = { version = "0.29", features = ["global-context", "recovery"], optional = true }

# Alloy primitives + RLP encoding (1.x for compatibility with liquidation-engine)
alloy = { version = "1.0", default-features = false, features = ["std", "rlp"] }

# Futures utilities (only join_all, select_all, FutureExt)
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# HTTP client for RPC
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hex encoding/decoding
hex = "0.4"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Parking lot for faster locks
parking_lot = "0.12"

# Dashmap for concurrent hashmap
dashmap = "6.0"

# async fn in traits — required for the dyn-compatible GasPriceProvider trait
async-trait = "0.1"

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["async_tokio"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
debug = false
